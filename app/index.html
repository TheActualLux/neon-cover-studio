<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Midnight Marquee — Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app" id="app">
  <header class="masthead">
    <div class="brand">
      <span class="brand-mark">MM</span>
      <span class="brand-text">
        <span class="brand-name">Midnight Marquee</span>
        <span class="brand-sub">poster cover studio</span>
      </span>
    </div>
    <div class="masthead-controls">
      <label class="ctl">
        <span>Layout</span>
        <select id="layout">
          <option value="big-left-with-two-right">Big left + two right</option>
          <option value="2x2">2 × 2 grid</option>
          <option value="full-bleed">Full bleed</option>
          <option value="tall-3-stack">Tall 3 stack</option>
          <option value="4-strip">4 strip</option>
        </select>
      </label>
      <label class="ctl">
        <span>Grade</span>
        <select id="grade">
          <option value="sunset">Sunset (1)</option>
          <option value="neon">Neon (2)</option>
          <option value="noir">Noir (3)</option>
          <option value="clean">Clean (4)</option>
        </select>
      </label>
      <button id="pick" class="btn btn-ghost" type="button">Add photos</button>
      <button id="shuffle" class="btn btn-ghost" type="button">Shuffle <kbd>R</kbd></button>
      <button id="export" class="btn btn-primary" type="button">Export PNG <kbd>E</kbd></button>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
    </div>
  </header>

  <main class="stage">
    <section class="hero">
      <div class="hero-frame" id="hero-frame">
        <canvas id="preview" width="1080" height="1350" aria-label="Cover preview"></canvas>
        <p class="drop-hint" id="drop-hint">Drop photos here &middot; paste &middot; or use Add photos</p>
      </div>
      <div class="transport">
        <span class="status" id="status" role="status">Ready</span>
        <div class="sizes" id="sizes" role="group" aria-label="Preview and export size">
          <button class="size-btn" type="button" data-size="1080x1080">1080 × 1080</button>
          <button class="size-btn is-active" type="button" data-size="1080x1350">1080 × 1350</button>
          <button class="size-btn" type="button" data-size="1920x1080">1920 × 1080</button>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <section class="panel-block">
        <h2>Film strip</h2>
        <div class="filmstrip" id="filmstrip" aria-label="Panels"></div>
        <p class="hint" id="selected-label">Frame 01 selected</p>
        <div class="panel-tools">
          <label class="ctl wide">
            <span>Zoom</span>
            <input id="panel-zoom" type="range" min="1" max="3" step="0.01" value="1">
          </label>
          <label class="ctl wide">
            <span>Pan X</span>
            <input id="panel-pan-x" type="range" min="-1" max="1" step="0.01" value="0">
          </label>
          <label class="ctl wide">
            <span>Pan Y</span>
            <input id="panel-pan-y" type="range" min="-1" max="1" step="0.01" value="0">
          </label>
          <button id="reset-panel" class="btn btn-ghost" type="button">Reset frame</button>
        </div>
      </section>

      <section class="panel-block">
        <h2>Type</h2>
        <label class="ctl wide">
          <span>Kicker</span>
          <input id="kicker" type="text" maxlength="64" value="NEON COAST PICTURES / CHAPTER ONE">
        </label>
        <label class="ctl wide">
          <span>Headline</span>
          <input id="headline" type="text" maxlength="60" value="SUNSET HEIST">
        </label>
        <label class="ctl wide">
          <span>Caption</span>
          <input id="caption" type="text" maxlength="90" value="A midnight marquee original">
        </label>
        <div class="row">
          <span class="row-label">Align</span>
          <div class="seg" id="align" role="group" aria-label="Text alignment">
            <button type="button" data-align="left" class="is-active">Left</button>
            <button type="button" data-align="center">Center</button>
            <button type="button" data-align="right">Right</button>
          </div>
        </div>
        <label class="ctl wide">
          <span>Tracking</span>
          <input id="tracking" type="range" min="0" max="0.2" step="0.005" value="0.06">
        </label>
      </section>

      <section class="panel-block">
        <h2>Effects</h2>
        <div class="toggles">
          <label class="toggle"><input id="fx-grain" type="checkbox" checked> Grain</label>
          <label class="toggle"><input id="fx-halftone" type="checkbox" checked> Halftone</label>
          <label class="toggle"><input id="fx-vignette" type="checkbox" checked> Vignette</label>
        </div>
        <p class="hint">Keys: 1–4 grade · E export · R shuffle</p>
      </section>
    </aside>
  </main>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
